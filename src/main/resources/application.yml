spring:
  application:
    name: UBot-BE

  profiles:
    default: local

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

operation-monitoring:
  prometheus:
    base-url: ${PROMETHEUS_BASE_URL:http://localhost:19090}
    connect-timeout: ${PROMETHEUS_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROMETHEUS_READ_TIMEOUT:10s}

app:
  ai:
    mode: ${AI_MODE:ollama}
    chat-engine: ${AI_CHAT_ENGINE:}
    embedding-engine: ${AI_EMBEDDING_ENGINE:}
    embedding-profile-version: ${EMBEDDING_PROFILE_VERSION:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

ranking:
  window-minutes: ${RANKING_WINDOW_MINUTES:60}
  size: ${RANKING_SIZE:5}
  refresh-scheduler-interval-minutes: ${REFRESH_SCHEDULER_INTERVAL_MINUTES:5}
  min-current-search-count: ${MIN_CURRENT_SEARCH_COUNT:20}
  baseline-period-days: ${BASELINE_PERIOD_DAYS:7}
  baseline-min-sample-count: ${BASELINE_MIN_SAMPLE_COUNT:20}
  trend-ratio-threshold: ${TREND_RATIO_THRESHOLD:20}

faq-monitoring:
  improvement:
    top-k: ${CHAT_TOP_K:3}
    low-similarity-threshold: ${FAQ_IMPROVEMENT_LOW_SIMILARITY_THRESHOLD:0.80}
    low-gap-rate-threshold: ${FAQ_IMPROVEMENT_LOW_GAP_RATE_THRESHOLD:0.30}
    unused-days: ${FAQ_IMPROVEMENT_UNUSED_DAYS:7}
    minimum-top-k-samples: ${FAQ_IMPROVEMENT_MIN_TOP_K_SAMPLES:20}
    minimum-top1-samples: ${FAQ_IMPROVEMENT_MIN_TOP1_SAMPLES:20}

faq:
  cache:
    # 공식 FAQ 답변을 그대로 반환합니다. 운영 질문셋 검증 후 켭니다.
    enabled: ${FAQ_CACHE_ENABLED:false}
    min-similarity: ${FAQ_CACHE_MIN_SIMILARITY:0.95}
    min-margin: ${FAQ_CACHE_MIN_MARGIN:0.15}
  retrieval:
    rerank:
      # 벡터 검색 후보를 Reranker로 다시 정렬할지 여부. 꺼 두면 Reranker 서버가 없어도 됩니다.
      enabled: ${FAQ_RERANK_ENABLED:false}
      candidate-k: ${FAQ_RERANK_CANDIDATE_K:10}
      model: ${FAQ_RERANK_MODEL:ubot-reranker}
      base-url: ${FAQ_RERANK_BASE_URL:http://localhost:8002}
      connect-timeout: ${FAQ_RERANK_CONNECT_TIMEOUT:500ms}
      read-timeout: ${FAQ_RERANK_READ_TIMEOUT:1500ms}
      fallback-enabled: ${FAQ_RERANK_FALLBACK_ENABLED:true}
      # 요청이 몰리거나 Reranker가 연속으로 실패할 때 호출을 건너뛰는 보호 장치
      max-concurrent: ${FAQ_RERANK_MAX_CONCURRENT:32}
      failure-threshold: ${FAQ_RERANK_FAILURE_THRESHOLD:5}
      failure-cooldown: ${FAQ_RERANK_FAILURE_COOLDOWN:10s}

data-retention:
  # 보관 기간이 지난 데이터 삭제(purge_expired_data) 실행 시각. Asia/Seoul 기준 Spring cron
  purge-cron: ${DATA_RETENTION_PURGE_CRON:0 0 4 * * *}
