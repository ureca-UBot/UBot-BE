spring:
  application:
    name: UBot-BE

  profiles:
    default: local

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

app:
  ai:
    mode: ${AI_MODE:ollama}
    chat-engine: ${AI_CHAT_ENGINE:}
    embedding-engine: ${AI_EMBEDDING_ENGINE:}
    embedding-profile-version: ${EMBEDDING_PROFILE_VERSION:1}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

ranking:
  window-minutes: ${RANKING_WINDOW_MINUTES:60}
  size: ${RANKING_SIZE:5}
  refresh-scheduler-interval-minutes: ${REFRESH_SCHEDULER_INTERVAL_MINUTES:5}
  min-current-search-count: ${MIN_CURRENT_SEARCH_COUNT:20}
  baseline-period-days: ${BASELINE_PERIOD_DAYS:7}
  baseline-min-sample-count: ${BASELINE_MIN_SAMPLE_COUNT:20}
  trend-ratio-threshold: ${TREND_RATIO_THRESHOLD:20}

faq-cache:
  enabled: ${FAQ_CACHE_ENABLED:false}
  semantic-enabled: ${FAQ_CACHE_SEMANTIC_ENABLED:false}
  registration-batch-size: ${FAQ_CACHE_REGISTRATION_BATCH_SIZE:8}
  min-similarity: ${FAQ_CACHE_MIN_SIMILARITY:0.95}
  min-margin: ${FAQ_CACHE_MIN_MARGIN:0.15}

faq-monitoring:
  improvement:
    top-k: ${CHAT_TOP_K:3}
    low-similarity-threshold: ${FAQ_IMPROVEMENT_LOW_SIMILARITY_THRESHOLD:0.80}
    low-gap-rate-threshold: ${FAQ_IMPROVEMENT_LOW_GAP_RATE_THRESHOLD:0.30}
    unused-days: ${FAQ_IMPROVEMENT_UNUSED_DAYS:7}
    minimum-top-k-samples: ${FAQ_IMPROVEMENT_MIN_TOP_K_SAMPLES:20}
    minimum-top1-samples: ${FAQ_IMPROVEMENT_MIN_TOP1_SAMPLES:20}
