# 두 실행 환경이 함께 쓰는 서비스입니다. 모델 서버는 환경별 파일에 있습니다.
#   Ollama 환경: docker-compose.ollama.yml
#   vLLM 환경:   docker-compose.vllm.yml
# 어느 파일을 함께 쓸지는 .env의 COMPOSE_FILE로 정합니다(.env.example 참고).
services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: ubot-postgres:18-pgvector0.8.6-postgis3.6.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
      image: redis:8-alpine
      restart: unless-stopped

      ports:
        - "127.0.0.1:${REDIS_PORT}:6379"

      volumes:
        - redis-data:/data

      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgres-data:
  redis-data:
  prometheus-data: