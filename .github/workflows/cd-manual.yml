name: Backend Manual CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubot-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/chore/152-runtime-env-split'


    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: staging

    env:
      IMAGE_NAME: ubot-be
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build backend Docker image
        run: |
          set -euo pipefail

          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Save backend Docker image
        run: |
          set -euo pipefail

          docker save "${IMAGE_NAME}:${GITHUB_SHA}" \
            | gzip > ubot-be.tar.gz

      - name: Validate deployment files
        run: |
          set -euo pipefail

          test -f docker-compose.yml
          test -f docker-compose.deploy.yml
          test -f docker-compose.ollama.yml
          test -f docker-compose.vllm.yml
          test -f infra/postgres/Dockerfile
          test -f infra/nginx/nginx.conf
          test -f infra/prometheus/prometheus.yml
          test -f infra/prometheus/prometheus.deploy.yml
          test -f infra/llm/docker-compose.yml
          test -f tools/deploy/deploy.sh

          bash -n tools/deploy/deploy.sh

      - name: Package deploy configuration
        run: |
          set -euo pipefail

          tar -czf ubot-deploy.tar.gz \
            docker-compose.yml \
            docker-compose.deploy.yml \
            docker-compose.ollama.yml \
            docker-compose.vllm.yml \
            infra/postgres/Dockerfile \
            infra/nginx/nginx.conf \
            infra/prometheus/prometheus.yml \
            infra/prometheus/prometheus.deploy.yml \
            infra/llm/docker-compose.yml \
            tools/deploy/deploy.sh

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${EC2_SSH_KEY}" \
            | tr -d '\r' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${EC2_HOST}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host ubot-staging
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh ubot-staging '
            set -euo pipefail

            echo "SSH connection successful"
            echo "user=$(whoami)"
            echo "host=$(hostname)"

            mkdir -p ~/ubot-deploy
          '

      - name: Upload deployment files
        run: |
          set -euo pipefail

          scp \
            ubot-be.tar.gz \
            ubot-deploy.tar.gz \
            ubot-staging:~/ubot-deploy/

      - name: Deploy on EC2
        run: |
          set -euo pipefail

          ssh ubot-staging \
            "IMAGE_NAME='${IMAGE_NAME}' GITHUB_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "== Prepare deployment directory =="

          mkdir -p ~/ubot

          tar -xzf \
            ~/ubot-deploy/ubot-deploy.tar.gz \
            -C ~/ubot

          echo "== Run deployment =="

          IMAGE_NAME="${IMAGE_NAME}" \
          GITHUB_SHA="${GITHUB_SHA}" \
            bash ~/ubot/tools/deploy/deploy.sh
          REMOTE