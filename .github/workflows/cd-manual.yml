name: Backend Manual CD

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "모델 서버 환경 (ollama: 같은 서버의 Ollama 컨테이너, vllm: 별도 GPU 서버의 vLLM)"
        type: choice
        options:
          - ollama
          - vllm
        default: ollama

permissions:
  contents: read

concurrency:
  group: ubot-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
  # 당장은 develop만 배포 허용
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment: staging

    env:
      IMAGE_NAME: ubot-be
      RUNTIME: ${{ inputs.runtime }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # --------------------------------------------------
      # 0. Compose files for the selected runtime
      # --------------------------------------------------
      # ollama: 같은 서버에 Ollama 컨테이너를 함께 띄웁니다(기본, 기존과 같은 구성).
      # vllm:   모델 서버는 별도 GPU 서버에 있으므로 공통 서비스와 backend만 띄웁니다.
      - name: Select compose files
        run: |
          if [ "$RUNTIME" = "vllm" ]; then
            echo "COMPOSE_ARGS=-p ubot -f docker-compose.yml -f docker-compose.deploy.yml" >> "$GITHUB_ENV"
            echo "MODEL_SERVICES=" >> "$GITHUB_ENV"
            echo "MODEL_INIT_SERVICE=" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_ARGS=-p ubot -f docker-compose.yml -f docker-compose.ollama.yml -f docker-compose.deploy.yml" >> "$GITHUB_ENV"
            echo "MODEL_SERVICES=ollama" >> "$GITHUB_ENV"
            echo "MODEL_INIT_SERVICE=ollama-init" >> "$GITHUB_ENV"
          fi

      # --------------------------------------------------
      # 1. Backend image build
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Save backend Docker image
        run: |
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" \
            | gzip > ubot-be.tar.gz

      # --------------------------------------------------
      # 2. Package deployment configuration
      # --------------------------------------------------
      - name: Package deploy configuration
        run: |
          tar -czf ubot-deploy.tar.gz \
            docker-compose.yml \
            docker-compose.ollama.yml \
            docker-compose.deploy.yml \
            infra/postgres/Dockerfile \
            infra/nginx/nginx.conf

      # --------------------------------------------------
      # 3. SSH configuration
      # --------------------------------------------------
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" \
            | tr -d '\r' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y \
            -f ~/.ssh/deploy_key \
            > /tmp/deploy_key.pub

          echo "Deploy key fingerprint:"
          ssh-keygen -lf /tmp/deploy_key.pub

          ssh-keyscan -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host ubot-staging
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

      # --------------------------------------------------
      # 4. SSH connection test
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh ubot-staging '
            echo "SSH connection successful"
            echo "user=$(whoami)"
            echo "host=$(hostname)"
          '

      # --------------------------------------------------
      # 5. Server preflight
      # --------------------------------------------------
      - name: Check deployment environment
        run: |
          ssh ubot-staging '
            set -e

            echo "== Docker =="
            docker version --format "{{.Server.Version}}"

            echo "== Docker Compose =="
            docker compose version

            echo "== Environment file =="

            if [ ! -f ~/ubot/.env ]; then
              echo "ERROR: ~/ubot/.env does not exist"
              exit 1
            fi

            echo "~/ubot/.env exists"

            mkdir -p ~/ubot-deploy
          '

      # --------------------------------------------------
      # 5-1. Runtime settings preflight (vllm)
      # --------------------------------------------------
      # vllm은 같은 서버에 Ollama를 띄우지 않습니다. 서버 .env가 Ollama를 쓰도록 남아 있으면
      # 배포는 성공해도 채팅이 동작하지 않으므로, 이미지를 올리기 전에 막습니다.
      - name: Validate runtime settings
        if: env.RUNTIME == 'vllm'
        run: |
          ssh ubot-staging 'bash -s' <<'EOF'
          set -eu

          ENV_FILE="$HOME/ubot/.env"

          # .env에서 마지막으로 정의된 값을 읽습니다. 주소는 로그에 남기지 않습니다.
          env_value() {
            line="$(grep -E "^[[:space:]]*$1=" "$ENV_FILE" | tail -n 1 | tr -d '\r')"
            value="${line#*=}"
            case "$value" in
              \"*\") value="${value#\"}"; value="${value%\"}" ;;
              \'*\') value="${value#\'}"; value="${value%\'}" ;;
              *) value="$(printf '%s' "$value" | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//')" ;;
            esac
            printf '%s' "$value"
          }

          failed=0

          for key in LLM_PROVIDER EMBEDDING_PROVIDER; do
            value="$(env_value "$key")"
            if [ "$value" != "openai-compatible" ]; then
              echo "::error::runtime=vllm needs ${key}=openai-compatible in ~/ubot/.env (current: ${value:-not set, so the backend uses ollama}). This runtime has no ollama container."
              failed=1
            fi
          done

          for key in LLM_BASE_URL EMBEDDING_BASE_URL; do
            value="$(env_value "$key")"
            case "$value" in
              "")
                echo "::error::${key} is not set in ~/ubot/.env. Without it the backend calls localhost inside its own container."
                failed=1
                ;;
              *://localhost*|*://127.*|*://\[::1\]*|*://ollama:*|*://ollama/*)
                echo "::error::${key} points to the backend container itself or to the ollama service. Set the GPU server address."
                failed=1
                ;;
              http://*|https://*)
                ;;
              *)
                echo "::error::${key} must start with http:// or https://."
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "Provider and base URL settings match runtime=vllm"

          # 주소가 맞는지는 실제 응답으로 확인합니다. GPU 서버가 꺼져 있을 수 있으므로 실패로 처리하지 않고 경고만 남깁니다.
          for key in LLM_BASE_URL EMBEDDING_BASE_URL; do
            url="$(env_value "$key")"
            if curl -fs -m 10 -o /dev/null "${url%/}/models" 2>/dev/null; then
              echo "${key}: model server answered"
            else
              echo "::warning::${key}: the model server did not answer /models. Chat will fail until it is reachable."
            fi
          done
          EOF

      # --------------------------------------------------
      # 6. Upload
      # --------------------------------------------------
      - name: Upload deployment files
        run: |
          scp \
            ubot-be.tar.gz \
            ubot-deploy.tar.gz \
            ubot-staging:~/ubot-deploy/

      # --------------------------------------------------
      # 7. Deploy
      # --------------------------------------------------
      - name: Deploy on EC2
        run: |
          ssh ubot-staging "
            set -e

            echo '== Prepare deployment directory =='

            mkdir -p ~/ubot

            tar -xzf \
              ~/ubot-deploy/ubot-deploy.tar.gz \
              -C ~/ubot

            echo '== Load backend Docker image =='

            gunzip -c \
              ~/ubot-deploy/ubot-be.tar.gz \
              | docker load

            cd ~/ubot

            echo '== Runtime: ${RUNTIME} =='

            # backend는 모델 서버를 기다리지 않으므로, 같은 서버에 띄우는 모델 서버는 먼저 준비시킵니다.
            if [ -n '${MODEL_SERVICES}' ]; then
              echo '== Start model server =='

              docker compose \
                ${COMPOSE_ARGS} \
                up -d --wait ${MODEL_SERVICES}

              echo '== Prepare models =='

              # 없는 모델만 받습니다. 처음 배포할 때는 내려받는 만큼 오래 걸립니다.
              docker compose \
                ${COMPOSE_ARGS} \
                run --rm -T ${MODEL_INIT_SERVICE}
            fi

            echo '== Start backend stack =='

            BACKEND_IMAGE='${IMAGE_NAME}:${GITHUB_SHA}' \
              docker compose \
                ${COMPOSE_ARGS} \
                up -d backend

            echo '== Recreate nginx =='

            BACKEND_IMAGE='${IMAGE_NAME}:${GITHUB_SHA}' \
              docker compose \
                ${COMPOSE_ARGS} \
                up -d \
                --no-deps \
                --force-recreate \
                nginx

            echo '== Container status =='

            BACKEND_IMAGE='${IMAGE_NAME}:${GITHUB_SHA}' \
              docker compose \
                ${COMPOSE_ARGS} \
                ps
          "

      # --------------------------------------------------
      # 8. Health check
      # --------------------------------------------------
      - name: Health check
        run: |
          ssh ubot-staging "COMPOSE_ARGS='${COMPOSE_ARGS}'"'
            echo "Waiting for backend..."

            for i in $(seq 1 30); do
              if curl -fsS \
                http://127.0.0.1/actuator/health; then

                echo
                echo "Backend is healthy"
                exit 0
              fi

              echo "Health check attempt ${i}/30 failed"
              sleep 5
            done

            echo
            echo "Health check failed"

            cd ~/ubot

            echo "== Container status =="

            docker compose \
              $COMPOSE_ARGS \
              ps -a

            echo "== Backend / nginx logs =="

            docker compose \
              $COMPOSE_ARGS \
              logs \
                --tail=200 \
                backend nginx

            exit 1
          '