name: AWS PoC BE CD

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Previously published BE image digest (sha256: followed by 64 hex characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AWS_BE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY_URL: ${{ vars.AWS_BE_ECR_REPOSITORY_URL }}
      ECR_REPOSITORY_NAME: ${{ vars.AWS_BE_ECR_REPOSITORY_NAME }}
      PUBLISH_ROLE_ARN: ${{ vars.AWS_BE_PUBLISH_ROLE_ARN }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check release variables
        run: |
          set -euo pipefail
          test -n "$ECR_REPOSITORY_URL"
          test -n "$ECR_REPOSITORY_NAME"
          test -n "$PUBLISH_ROLE_ARN"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout the exact CI commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate BE deployment bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          cp infra/aws/be/env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env \
            -f docker-compose.api.yml -f docker-compose.worker.yml config --quiet
          bash -n tools/deploy/aws-be-deploy.sh
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -e FE_PRIVATE_IP=10.20.0.10 \
            -e CHAT_GUEST_RATE_LIMIT_RATE=30r/m \
            -e CHAT_GUEST_RATE_LIMIT_BURST=10 \
            -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx \
            -v "$PWD/infra/nginx/nginx.api.conf.template:/etc/nginx/templates/nginx.conf.template:ro" \
            nginx:alpine nginx -t

      - name: Assume image publisher role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BE_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Build and publish the CI commit
        id: image
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
              --image-ids "imageTag=$RELEASE_SHA" >/dev/null 2>&1; then
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
            docker build -t "${ECR_REPOSITORY_URL}:${RELEASE_SHA}" .
            docker push "${ECR_REPOSITORY_URL}:${RELEASE_SHA}"
          fi
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$RELEASE_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${RELEASE_SHA} as ${ECR_REPOSITORY_URL}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [publish]
    if: >-
      always() &&
      vars.AWS_BE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: aws-poc
    concurrency:
      group: aws-poc-be-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      IMAGE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.image_digest || needs.publish.outputs.image_digest }}
      ECR_REPOSITORY_NAME: ${{ vars.AWS_BE_ECR_REPOSITORY_NAME }}
      BE_INSTANCE_ID: ${{ vars.AWS_BE_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: ${{ vars.AWS_BE_SSM_DOCUMENT_NAME }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_BE_DEPLOY_ROLE_ARN }}

    steps:
      - name: Validate deployment input and target
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$ECR_REPOSITORY_NAME"
          test -n "$BE_INSTANCE_ID"
          test -n "$SSM_DOCUMENT_NAME"
          test -n "$DEPLOY_ROLE_ARN"

      - name: Assume BE deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BE_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Check image exists
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageDigest=$IMAGE_DIGEST" >/dev/null

      - name: Check the current develop commit
        if: github.event_name == 'workflow_run'
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [ "$current_sha" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Skipped stale CI commit ${RELEASE_SHA}; develop is ${current_sha}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy through SSM
        if: github.event_name == 'workflow_dispatch' || steps.head.outputs.deploy == 'true'
        id: command
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$BE_INSTANCE_ID" \
            --parameters "ImageDigest=$IMAGE_DIGEST" \
            --timeout-seconds 120 \
            --comment "UBot BE ${IMAGE_DIGEST}" \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for deployment result
        if: steps.command.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          set -euo pipefail
          for ((attempt = 1; attempt <= 150; attempt++)); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$BE_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$BE_INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode}' --output json
                response_code="$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$BE_INSTANCE_ID" \
                  --query ResponseCode --output text)"
                test "$response_code" -eq 0
                exit 0
                ;;
              ''|Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;
              *)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$BE_INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Error:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
          done
          echo "SSM deployment did not finish within 25 minutes: $COMMAND_ID" >&2
          exit 1
