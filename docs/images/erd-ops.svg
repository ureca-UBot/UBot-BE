<text x="44" y="520" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">retention.withdrawn_user_records는 탈퇴 회원의 법정 보관 정보(전자상거래법 5년)를 retention 스키마에 따로 둡니다.</text>
