# AI_MODE=ollama일 때 쓰는 모델 서버입니다. docker-compose.yml과 함께 씁니다.
services:
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 임베딩 모델을 받고, OLLAMA_CHAT_MODEL이 있으면 채팅 모델도 받습니다.
  # 이미 있는 모델은 다시 받지 않습니다. 그래서 배포할 때마다 실행해도 되고, 모델이 있으면 외부 연결 없이 끝납니다.
  ollama-init:
    image: ollama/ollama:0.34.0
    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      # 기본값은 백엔드(application-local.yml)의 기본값과 같습니다.
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:567m}
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pull_if_missing() {
          if ollama show "$$1" > /dev/null 2>&1; then
            echo "$$1: already present"
          else
            ollama pull "$$1"
          fi
        }

        pull_if_missing "$$EMBEDDING_MODEL"
        if [ -n "$$CHAT_MODEL" ]; then
          pull_if_missing "$$CHAT_MODEL"
        fi

volumes:
  ollama-data:
