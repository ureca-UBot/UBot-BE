events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8080;
    }

    map $http_authorization $chat_guest_key {
        default        $binary_remote_addr;
        "~^Bearer .+"  "";
    }

    limit_req_zone $chat_guest_key zone=chat_guest:10m rate=${CHAT_GUEST_RATE_LIMIT_RATE};
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;

        location ^~ /actuator/prometheus {
            return 404;
        }

        location ^~ /api/actuator/prometheus {
            return 404;
        }

        location /chat/ {
            limit_req zone=chat_guest burst=${CHAT_GUEST_RATE_LIMIT_BURST} nodelay;
            error_page 429 = @chat_rate_limited;

            proxy_pass http://backend;
        }

        location /api/chat/ {
            limit_req zone=chat_guest burst=${CHAT_GUEST_RATE_LIMIT_BURST} nodelay;
            error_page 429 = @chat_rate_limited;

            proxy_pass http://backend/chat/;
        }

        location /api/ {
            proxy_pass http://backend/;
        }

        location = /admin/faqs/embeddings/backfill {
            proxy_read_timeout 3600s;
            proxy_pass http://backend;
        }

        location = /admin/unanswered-groups/embeddings/backfill {
            proxy_read_timeout 3600s;
            proxy_pass http://backend;
        }

        location = /api/admin/faqs/embeddings/backfill {
            proxy_read_timeout 3600s;
            proxy_pass http://backend/admin/faqs/embeddings/backfill;
        }

        location = /api/admin/unanswered-groups/embeddings/backfill {
            proxy_read_timeout 3600s;
            proxy_pass http://backend/admin/unanswered-groups/embeddings/backfill;
        }

        location @chat_rate_limited {
            default_type "application/json; charset=utf-8";
            return 429 '{"success":false,"code":"RATE-001","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요.","data":null}';
        }

        root /var/www/ubot-fe;

        location = / {
            try_files /index.html @backend;
        }

        location / {
            try_files $uri @backend;
        }

        location @backend {
            proxy_pass http://backend;
        }
    }
}
