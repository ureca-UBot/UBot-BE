events {}

http {
    upstream backend {
        server backend:8080;
    }

    map $http_authorization $chat_guest_key {
        default "";
        ""      $binary_remote_addr;
    }

    limit_req_zone $chat_guest_key zone=chat_guest:10m rate=${CHAT_GUEST_RATE_LIMIT_RATE};
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;

        location ^~ /actuator/prometheus {
            return 404;
        }

        location /chat/ {
            limit_req zone=chat_guest burst=${CHAT_GUEST_RATE_LIMIT_BURST} nodelay;            error_page 429 = @chat_rate_limited;

            proxy_pass http://backend;
        }

        location @chat_rate_limited {
            default_type "application/json; charset=utf-8";
            return 429 '{"success":false,"code":"RATE-001","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요.","data":null}';
        }

        location / {
            proxy_pass http://backend;
        }
    }
}
