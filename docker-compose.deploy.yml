services:
  backend:
    image: ${BACKEND_IMAGE:-ubot-be:local}

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_HOST: redis
      REDIS_PORT: 6379


    expose:
      - "8080"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    restart: unless-stopped