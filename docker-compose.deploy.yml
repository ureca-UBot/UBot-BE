services:
  backend:
    image: ${BACKEND_IMAGE:-ubot-be:local}

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # docker-compose.ollama.yml을 함께 쓸 때(AI_MODE=ollama)만 쓰이는 주소입니다.
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_HOST: redis
      REDIS_PORT: 6379


    expose:
      - "8080"

    restart: unless-stopped

    # 모델 서버는 여기에 넣지 않습니다. AI_MODE=vllm에는 ollama 서비스가 없고, 백엔드는 모델 서버 없이도 기동합니다.
    # 모델 서버를 함께 띄울 때는 CD가 모델 서버를 먼저 띄우고 준비를 확인한 뒤 backend를 띄웁니다(docs/deploy.md).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      CHAT_GUEST_RATE_LIMIT_RATE: ${CHAT_GUEST_RATE_LIMIT_RATE:-30r/m}
      CHAT_GUEST_RATE_LIMIT_BURST: ${CHAT_GUEST_RATE_LIMIT_BURST:-10}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro

    depends_on:
      - backend

    restart: unless-stopped