# 로컬에서 배포 형태를 띄울 때만 docker-compose.deploy.yml 뒤에 함께 씁니다(docs/deploy.md). 서버 배포에는 쓰지 않습니다.
# 로컬 .env의 주소는 호스트에서 실행하는 백엔드 기준(localhost)이라, 컨테이너 안에서 쓰는 주소로 바꿉니다.
services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_BASE_URL: http://vllm:8000/v1
      EMBEDDING_BASE_URL: http://vllm-embedding:8000/v1
